<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141c3a" />
  <title>Connexion · Le AppHub</title>

  <script>
    // Si l'utilisateur est déjà connecté dans cette session, on va directement au menu
    if (sessionStorage.getItem("apphub_auth_ok") === "1") {
      window.location.replace("./index.html");
    }
  </script>

  <style>
    /* =========================================================================
       VARIABLES & THÈME (Assortis à AppHub & Pokéhub : clair & sombre auto)
       ========================================================================= */
    :root {
      --bg: #eef1f7;
      --surface: #ffffff;
      --surface-2: #e5e9f3;
      --text: #141c3a;
      --muted: #566082;
      --border: #d2d9ea;
      --navy: #141c3a;
      --accent: #e5383b;
      --accent-hover: #cc2b2e;
      --gold: #ffc531;
      --gold-text: #3a2900;
      --miss: #c2272b;
      --miss-soft: #fde3e3;
      --shadow: 0 12px 32px rgba(20, 28, 58, 0.1);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1430;
        --surface: #162047;
        --surface-2: #1f2b5c;
        --text: #e9edfb;
        --muted: #9aa6cf;
        --border: #2d3a73;
        --miss: #ff8a8d;
        --miss-soft: #43202f;
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: ui-rounded, "SF Pro Rounded", "Inter", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================================
       BARRE DU HAUT SOBRE
       ========================================================================= */
    .topbar {
      background-color: var(--navy);
      color: #ffffff;
      border-bottom: 3px solid var(--accent);
      padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    }

    .topbar-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.01em;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 3px rgba(255, 197, 49, 0.25);
      flex: none;
    }

    .domain-pill {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(255, 255, 255, 0.12);
      padding: 4px 12px;
      border-radius: 999px;
    }

    /* =========================================================================
       CARTE DE CONNEXION CENTRÉE
       ========================================================================= */
    .main-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px 48px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background-color: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }

    /* Animation de secousse en cas d'erreur */
    @keyframes shakeCard {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .login-card.shake {
      animation: shakeCard 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    .lock-badge {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #141c3a 0%, #233163 100%);
      color: var(--gold);
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      border: 1.5px solid rgba(255, 197, 49, 0.3);
    }

    .login-card h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .login-card .subtitle {
      margin: 4px 0 22px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field input {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 0.96rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field input.with-toggle {
      padding-right: 46px;
    }

    .field input:focus {
      outline: none;
      border-color: var(--text);
      box-shadow: 0 0 0 3px rgba(255, 197, 49, 0.35);
    }

    .toggle-pass {
      position: absolute;
      right: 6px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .toggle-pass:hover {
      color: var(--text);
      background-color: var(--surface-2);
    }

    .error-box {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 12px;
      background-color: var(--miss-soft);
      color: var(--miss);
      font-size: 0.86rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .error-box[hidden] {
      display: none;
    }

    .btn-submit {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 13px;
      background-color: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      font-size: 0.98rem;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.12s ease;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- En-tête sobre -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>AppHub</span>
      </div>
    </div>
  </header>

  <!-- Formulaire de connexion -->
  <main class="main-wrap">
    <div class="login-card" id="loginCard">
      <div class="lock-badge" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="3" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>

      <h1>Connexion</h1>
      <p class="subtitle">Identifie-toi pour accéder au menu des applications.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginUser">Identifiant</label>
          <div class="input-wrap">
            <input
              type="text"
              id="loginUser"
              name="username"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Ton identifiant"
              required
            />
          </div>
        </div>

        <div class="field">
          <label for="loginPass">Mot de passe</label>
          <div class="input-wrap">
            <input
              type="password"
              id="loginPass"
              name="password"
              class="with-toggle"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              class="toggle-pass"
              id="togglePassBtn"
              aria-label="Afficher le mot de passe"
              title="Afficher / masquer"
            >
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="error-box" id="loginError" role="alert" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>Identifiant ou mot de passe incorrect.</span>
        </div>

        <button type="submit" class="btn-submit">Se connecter</button>
      </form>
    </div>
  </main>

  <script>
    /* =========================================================================
       IDENTIFIANTS LOCAUX (Modifie ces deux valeurs selon tes préférences)
       ========================================================================= */
    const AUTH_USER = "toto";
    const AUTH_PASS = "toto";

    // Clé de session partagée avec menu.html
    const SESSION_KEY = "apphub_auth_ok";

    /*
     * GARDE-FOU À COLLER DANS <head> DE menu.html POUR EMPÊCHER L'ACCÈS DIRECT :
     *
     * <script>
     *   if (sessionStorage.getItem("apphub_auth_ok") !== "1") {
     *     window.location.replace("./index.html");
     *   }
     * <\/script>
     */

    const card = document.getElementById("loginCard");
    const form = document.getElementById("loginForm");
    const userInput = document.getElementById("loginUser");
    const passInput = document.getElementById("loginPass");
    const toggleBtn = document.getElementById("togglePassBtn");
    const errorBox = document.getElementById("loginError");

    // Focus automatique sur l'identifiant
    window.addEventListener("DOMContentLoaded", () => {
      userInput.focus();
    });

    // Bouton afficher / masquer le mot de passe
    toggleBtn.addEventListener("click", () => {
      const isHidden = passInput.type === "password";
      passInput.type = isHidden ? "text" : "password";
      toggleBtn.setAttribute("aria-label", isHidden ? "Masquer le mot de passe" : "Afficher le mot de passe");
    });

    // Efface l'erreur dès que l'utilisateur retape
    [userInput, passInput].forEach((input) => {
      input.addEventListener("input", () => {
        if (!errorBox.hidden) errorBox.hidden = true;
      });
    });

    // Validation stricte du formulaire
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const enteredUser = userInput.value.trim();
      const enteredPass = passInput.value;

      if (enteredUser === AUTH_USER && enteredPass === AUTH_PASS) {
        // Connexion réussie : on valide la session et on redirige vers le menu
        sessionStorage.setItem(SESSION_KEY, "1");
        errorBox.hidden = true;
        window.location.href = "./index.html";
      } else {
        // Connexion refusée : pas de session, pas de redirection, secousse + reset mot de passe
        sessionStorage.removeItem(SESSION_KEY);
        errorBox.hidden = false;
        passInput.value = "";
        passInput.focus();

        card.classList.remove("shake");
        void card.offsetWidth; // Force le redémarrage de l'animation CSS
        card.classList.add("shake");
      }
    });
  </script>
</body>
</html>
